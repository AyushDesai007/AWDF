name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: AWDF_PRAC-6-main/backend
        run: npm install

      - name: Run tests
        working-directory: AWDF_PRAC-6-main/backend
        env:
          NODE_ENV: test
          JWT_SECRET: awdf-ci-secret-2026-key
        run: npm test
